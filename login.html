<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Biodata Builder</title>
  <meta name="description" content="Log in to manage and edit your marriage biodata profile.">
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-card-container">
    <div class="auth-brand-header">
      <a href="index.html" class="auth-brand-logo">
        <span>💍</span>
        <span>BiodataBuilder</span>
      </a>
      <p class="auth-brand-sub">Craft your marriage biodata with timeless elegance</p>
    </div>

    <div class="auth-card">
      <h1 class="auth-card-title">Welcome Back</h1>
      <p class="auth-card-desc">Log in to continue customizing and sharing your biodata</p>

      <!-- Dynamic Friendly Error Box -->
      <div id="auth-error-alert" class="alert alert-error" style="display: none;" role="alert"></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            class="form-input" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <div class="form-label">
            <label for="login-password">Password</label>
            <a href="#" id="forgot-password-link" class="auth-link" style="font-size: 0.8rem; font-weight: normal;">Forgot password?</a>
          </div>
          <div class="input-password-wrap">
            <input 
              type="password" 
              id="login-password" 
              class="form-input" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="btn-toggle-pwd" aria-label="Toggle password visibility">👁️ Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="btn-login-submit">Log In</button>
      </form>

      <div class="auth-footer-links">
        <span>Don't have an account yet?</span>
        <a href="signup.html" class="auth-link">Create Account</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth-controller.js"></script>
</body>
</html>
