<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Biodata Builder</title>
  <meta name="description" content="Sign up to build and customize your beautiful marriage biodata.">
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-card-container">
    <div class="auth-brand-header">
      <a href="index.html" class="auth-brand-logo">
        <span>💍</span>
        <span>BiodataBuilder</span>
      </a>
      <p class="auth-brand-sub">Craft your marriage biodata with timeless elegance</p>
    </div>

    <div class="auth-card">
      <h1 class="auth-card-title">Create Account</h1>
      <p class="auth-card-desc">Get started in seconds — completely free and private</p>

      <!-- Dynamic Friendly Error Box -->
      <div id="auth-error-alert" class="alert alert-error" style="display: none;" role="alert"></div>

      <form id="signup-form" class="auth-form">
        <div class="form-group">
          <label for="signup-name" class="form-label">Full Name</label>
          <input 
            type="text" 
            id="signup-name" 
            class="form-input" 
            placeholder="e.g. Rahul Sharma" 
            required 
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="signup-email" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="signup-email" 
            class="form-input" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="signup-password" class="form-label">Password</label>
          <div class="input-password-wrap">
            <input 
              type="password" 
              id="signup-password" 
              class="form-input" 
              placeholder="Minimum 6 characters" 
              required 
              minlength="6"
              autocomplete="new-password"
            >
            <button type="button" class="btn-toggle-pwd" aria-label="Toggle password visibility">👁️ Show</button>
          </div>
        </div>

        <div class="form-group">
          <label for="signup-confirm-password" class="form-label">Confirm Password</label>
          <div class="input-password-wrap">
            <input 
              type="password" 
              id="signup-confirm-password" 
              class="form-input" 
              placeholder="Re-enter your password" 
              required 
              minlength="6"
              autocomplete="new-password"
            >
            <button type="button" class="btn-toggle-pwd" aria-label="Toggle password visibility">👁️ Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="btn-signup-submit">Create Account</button>
      </form>

      <div class="auth-footer-links">
        <span>Already have an account?</span>
        <a href="login.html" class="auth-link">Log In</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth-controller.js"></script>
</body>
</html>
